version: '3.8'
services:
  backend:
    build: ./backend
    ports:
      - "8000:8000"
    volumes:
      # This maps your AWS credentials into the backend container
      # so Boto3 can authenticate and trigger your Lambda function
      - ~/.aws:/root/.aws:ro 

  frontend:
    build: ./frontend
    ports:
      - "3000:3000"
    depends_on:
      - backend