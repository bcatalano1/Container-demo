<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>High-Altitude Sourdough Calculator</title>
    <style>
      :root {
        --bg: #f7f3ee;
        --panel: rgba(255, 255, 255, 0.9);
        --panel-border: rgba(111, 78, 55, 0.12);
        --primary: #7a4b2a;
        --primary-dark: #56351e;
        --accent: #d9b38c;
        --text: #2e241d;
        --muted: #695b53;
        --success: #2f7d56;
        --error: #a63d2d;
        --shadow: 0 18px 40px rgba(55, 36, 24, 0.12);
      }

      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        min-height: 100vh;
        font-family: Arial, Helvetica, sans-serif;
        background:
          radial-gradient(circle at top, rgba(217, 179, 140, 0.55), transparent 35%),
          linear-gradient(135deg, #f8f0e8 0%, #f3efe9 35%, #efe5dc 100%);
        color: var(--text);
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 24px;
      }

      .card {
        width: min(100%, 520px);
        background: var(--panel);
        backdrop-filter: blur(8px);
        border: 1px solid var(--panel-border);
        border-radius: 22px;
        box-shadow: var(--shadow);
        padding: 28px 22px;
      }

      .eyebrow {
        display: inline-block;
        font-size: 0.72rem;
        letter-spacing: 0.12em;
        text-transform: uppercase;
        font-weight: 700;
        color: var(--primary);
        margin-bottom: 12px;
      }

      h1 {
        margin: 0 0 6px;
        font-size: clamp(2rem, 3vw, 2.7rem);
        line-height: 1.1;
      }

      h2 {
        margin: 0 0 6px;
        font-size: clamp(2rem, 3vw, 2.7rem);
        line-height: 1.1;
      }

      .subtitle {
        margin: 0 0 22px;
        color: var(--muted);
        font-size: 0.98rem;
        line-height: 1.5;
      }

      form {
        display: grid;
        gap: 18px;
      }

      .field {
        display: grid;
        gap: 8px;
      }

      label {
        font-size: 0.96rem;
        font-weight: 700;
        color: var(--text);
      }

      input {
        width: 100%;
        border: 1px solid rgba(122, 75, 42, 0.25);
        background: rgba(255, 255, 255, 0.7);
        border-radius: 12px;
        padding: 14px 14px;
        font-size: 1.05rem;
        color: var(--text);
        transition: border-color 0.2s ease, box-shadow 0.2s ease;
      }

      input:focus {
        outline: none;
        border-color: var(--primary);
        box-shadow: 0 0 0 4px rgba(122, 75, 42, 0.12);
      }

      button {
        border: none;
        border-radius: 12px;
        padding: 16px 18px;
        font-size: 1rem;
        font-weight: 700;
        color: white;
        background: linear-gradient(135deg, var(--primary) 0%, var(--primary-dark) 100%);
        cursor: pointer;
        transition: transform 0.15s ease, box-shadow 0.2s ease;
        box-shadow: 0 10px 22px rgba(86, 53, 30, 0.25);
      }

      button:hover {
        transform: translateY(-1px);
      }

      button:active {
        transform: translateY(0);
      }
      button:disabled {
      background-color: #cccccc !important; /* Make it gray */
      color: #666666 !important;            /* Dark gray text */
      cursor: not-allowed;                  /* Changes the mouse to a red circle with a slash */
      opacity: 0.7;                         /* Make it slightly faded */
      border: 1px solid #999999;
      }

      /* Optional: Make your active buttons look clickable */
      button:not(:disabled) {
          cursor: pointer;
      }

      .result {
        margin-top: 22px;
        background: linear-gradient(135deg, rgba(217, 179, 140, 0.18), rgba(122, 75, 42, 0.06));
        border: 1px solid rgba(122, 75, 42, 0.12);
        border-radius: 18px;
        padding: 18px 16px;
        display: none;
      }

      .result.visible {
        display: block;
      }

      .result-label {
        text-transform: uppercase;
        letter-spacing: 0.08em;
        font-size: 0.72rem;
        color: var(--muted);
        margin-bottom: 8px;
        font-weight: 700;
      }

      .result-value {
        font-size: clamp(2rem, 5vw, 3rem);
        font-weight: 800;
        color: var(--success);
        line-height: 1.1;
      }

      .result-meta {
        margin-top: 10px;
        color: var(--muted);
        font-size: 0.9rem;
      }

      .error {
        margin-top: 14px;
        background: rgba(166, 61, 45, 0.08);
        color: var(--error);
        border: 1px solid rgba(166, 61, 45, 0.18);
        border-radius: 12px;
        padding: 12px 14px;
        display: none;
        font-weight: 600;
      }

      .error.visible {
        display: block;
      }

      @media (max-width: 480px) {
        body {
          padding: 16px;
        }

        .card {
          padding: 22px 16px;
        }

        h1 {
          font-size: 2rem;
        }
        h2 {
          font-size: 2rem;
        }
      }
    </style>
  </head>
  <body>
    <main class="card">
      <div class="eyebrow">Baking science</div>
      <h1>High-Altitude Sourdough Calculator</h1>
      <p class="subtitle">
        Adjust hydration for elevation so your loaf stays workable in thinner air.
      </p>

      <form id="calculator-form">
        <div class="field">
          <label for="base-hydration">Base Hydration (%)</label>
          <input id="base-hydration" name="base_hydration" type="number" step="0.1" min="0" value="75" required />
        </div>

        <div class="field">
          <label for="elevation">Elevation (feet)</label>
          <input id="elevation" name="elevation" type="number" step="1" min="0" value="6224" required />
        </div>

        <button type="submit">Calculate Hydration</button>
      </form>

      <h2>Recent Recipes</h2>
      <div id="recipes-list" class="recipes-list"></div>
      <div style="margin-top: 15px;">
        <button id="prevBtn" onclick="goBack()" disabled>Previous 10</button>
        <button id="nextBtn" onclick="goForward()" disabled>Next 10</button>
      </div>
      <div id="error-message" class="error" aria-live="polite"></div>

      <section id="result" class="result" aria-live="polite">
        <div class="result-label">Adjusted Hydration</div>
        <div id="adjusted-hydration" class="result-value">--</div>
        <div class="result-meta" id="result-meta">Your final hydration percentage appears here.</div>
      </section>
    </main>

    <script>
      const form = document.getElementById('calculator-form');
      const result = document.getElementById('result');
      const adjustedHydration = document.getElementById('adjusted-hydration');
      const resultMeta = document.getElementById('result-meta');
      const errorMessage = document.getElementById('error-message');
      let keyHistory = [null]; //page 1 always start with no bookmarks
      let currentPage = 0;
      let nextBookmark = null;

      form.addEventListener('submit', async function (event) {
        event.preventDefault();

        const baseHydration = Number(document.getElementById('base-hydration').value);
        const elevation = Number(document.getElementById('elevation').value);

        errorMessage.textContent = '';
        errorMessage.classList.remove('visible');

        if (!Number.isFinite(baseHydration) || !Number.isFinite(elevation)) {
          errorMessage.textContent = 'Please enter valid numbers for both fields.';
          errorMessage.classList.add('visible');
          return;
        }

        try {
          const response = await fetch('http://localhost:8000/calculate', {
            method: 'POST',
            headers: {
              'Content-Type': 'application/json',
            },
            body: JSON.stringify({
              base_hydration: baseHydration,
              elevation: elevation,
            }),
          });

          if (!response.ok) {
            throw new Error(`Request failed with status ${response.status}`);
          }

          const data = await response.json();
          const payload = data.body && typeof data.body === 'object' ? data.body : data;

          const finalHydration = Number(payload.final_hydration);

          if (!Number.isFinite(finalHydration)) {
            throw new Error('Invalid hydration response from the server.');
          }

          adjustedHydration.textContent = `${finalHydration.toFixed(2)}%`;
          resultMeta.textContent = `Base hydration: ${Number(payload.base_hydration).toFixed(2)}% • Added water: ${Number(payload.added_water_percentage).toFixed(2)}%`;
          result.classList.add('visible');
        } catch (error) {
          console.error(error);
          errorMessage.textContent = 'Unable to calculate hydration. Please check that the backend is running and try again.';
          errorMessage.classList.add('visible');
          result.classList.remove('visible');
        }
      });
      async function loadRecipes(startKey = null) {
        let url = 'http://localhost:8000/recipes';
        if (startKey) {
          url += `?start_recipe_id=${encodeURIComponent(startKey)}`;
        }
        try {
          const response = await fetch(url);

          if (!response.ok) {
            throw new Error(`Request failed with status ${response.status}`);
          }
          const data = await response.json();
          console.log("Backend sent this many recipes:", data.items.length);
          console.log("Next bookmark is:", data.next_key);
          //const recipes = await response.json();
          const listElement = document.getElementById('recipes-list');
          listElement.innerHTML = '';
          if (data.items.length === 0) {
            listElement.textContent = 'No recent recipes found.';
            return;
          }
          data.items.forEach(recipe => {
            //const recipeCard = document.createElement('div');
            //recipeCard.textContent = `Recipe ID: ${recipe.recipe_id}, Base Hydration: ${recipe.base_hydration}%, Elevation: ${recipe.elevation} ft, Final Hydration: ${recipe.final_hydration}%`;
            const recipeCard = `
            <div style="border: 1px solid #ccc; padding: 10px; margin-top: 10px;">
                <p><strong>Base Hydration:</strong> ${recipe.base_hydration}%</p>
                <p><strong>Elevation:</strong> ${recipe.elevation} ft</p>
                <p><strong>Added Water:</strong> ${recipe.added_water_percentage}%</p>
                <p><strong>Final Hydration:</strong> ${recipe.final_hydration}%</p>
            </div>
            `;
            //listElement.appendChild(recipeCard);
            listElement.innerHTML += recipeCard;
          });
          // Update pagination buttons
          nextBookmark = data.next_key;
          const prevBtn = document.getElementById('prevBtn');
          const nextBtn = document.getElementById('nextBtn');

          // Handle the Previous Button
          if (currentPage === 0) {
              prevBtn.disabled = true;  // We are on page 1, lock the button
          } else {
              prevBtn.disabled = false; // We are on page 2+, unlock the button
          }

          // Handle the Next Button
          if (!nextBookmark) {
              nextBtn.disabled = true;  // No bookmark from AWS = no more recipes, lock it
          } else {
              nextBtn.disabled = false; // AWS gave us a bookmark, unlock it
          }

        } 
        catch (error) {
          console.error(error);
          const listElement = document.getElementById('recipes-list');
          listElement.textContent = 'Unable to load recent recipes. Please check that the backend is running and try again.';
        }
      }
      function goForward() {
        if (nextBookmark) {
            currentPage++;
            keyHistory[currentPage] = nextBookmark; // Save the bookmark so we can go back later!
            loadRecipes(nextBookmark);
        }
      }

      function goBack() {
          if (currentPage > 0) {
              currentPage--;
              loadRecipes(keyHistory[currentPage]);
          }
      }
      window.onload =() => loadRecipes();
    </script>
  </body>
</html>
